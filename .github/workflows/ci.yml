name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests loadtest
      - run: python -m pytest -v

  image:
    name: Build and smoke-test the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t navidad-api:ci .
      - name: Start the container and check liveness
        run: |
          docker run -d --name api -p 8000:8000 navidad-api:ci
          for i in $(seq 20); do curl -sf localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api
          exit 1
