apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - podmonitor.yaml
configMapGenerator:
  - name: navidad-api-dashboard
    namespace: monitoring
    files:
      - dashboards/navidad-api.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
